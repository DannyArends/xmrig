# .github/workflows/batchedX.yml
name: batchedX-avx512
on:
  push:
    branches: [batchedX-avx512]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Report CPU
        run: |
          echo "CPU: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y ccache cmake build-essential libuv1-dev libhwloc-dev libssl-dev

      - name: Install Intel SDE
        run: |
          set -euo pipefail
          SDE_URL=$(curl -sL https://www.intel.com/content/www/us/en/download/684897/intel-software-development-emulator.html \
                    | grep -Po 'https://downloadmirror\.intel\.com/[^"]*lin\.tar\.xz' | head -1)
          echo "SDE URL: $SDE_URL"
          test -n "$SDE_URL"
          wget -qO sde.tar.xz "$SDE_URL"
          mkdir sde && tar -xf sde.tar.xz -C sde --strip-components=1
          echo "$PWD/sde" >> "$GITHUB_PATH"

      - name: Set ccache dir
        run: echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Prime ccache
        run: |
          ccache -M 500M
          ccache -z

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DWITH_RANDOMX=ON -DWITH_BATCHEDX=ON \
            -DWITH_CN_LITE=OFF -DWITH_CN_HEAVY=OFF -DWITH_CN_PICO=OFF -DWITH_CN_FEMTO=OFF \
            -DWITH_ARGON2=OFF -DWITH_KAWPOW=OFF -DWITH_GHOSTRIDER=OFF \
            -DWITH_OPENCL=OFF -DWITH_CUDA=OFF -DWITH_NVML=OFF -DWITH_ADL=OFF \
            -DWITH_HTTP=OFF -DWITH_ENV_VARS=OFF -DWITH_DMI=OFF -DWITH_BENCHMARK=OFF \
            -DWITH_HWLOC=ON -DWITH_ASM=ON -DWITH_MSR=OFF

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: ccache stats
        run: ccache -s

      - name: Run batched verify
        run: |
          if grep -qm1 avx512f /proc/cpuinfo; then
            echo "== native AVX-512 =="
            ./build/xmrig --batchedx-verify
          else
            echo "== no AVX-512: emulating with Intel SDE (-icx) =="
            sde64 -icx -- ./build/xmrig --batchedx-verify
          fi
